<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kayıp Evcil Hayvan Ekle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0f7fa;
      padding: 20px;
    }
    h1 {
      color: #006064;
    }
    form {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #006064;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #004d40;
    }
  </style>
</head>
<body>

<h1>Kayıp Evcil Hayvan Ekle</h1>

<form action="add_pet.php" method="post">
  <label>Hayvan Adı:</label>
  <input type="text" name="name" required>

  <label>Tür:</label>
  <select name="type" required>
    <option value="Kedi">Kedi</option>
    <option value="Köpek">Köpek</option>
    <option value="Kuş">Kuş</option>
    <option value="Diğer">Diğer</option>
  </select>

  <label>Şehir:</label>
  <input type="text" name="city" required>

  <label>Tarih:</label>
  <input type="date" name="date" required>

  <button type="submit">Kaydet</button>
</form>

</body>
</html>
